name: CI - Publish

on:
  push:
    tags:
      - '*'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          registry-url: https://npm.pkg.github.com/
          node-version: 20
          cache: 'npm'
      - name: Installing dependencies
        run: npm install
      - name: Building the Application
        run: npm run build
      - name: Publish the Application
        run: npm publish
